spring:
  rabbitmq:
    listener:
      simple:
        # 消费者代码使用手动 ACK/NACK（延迟重试、毒消息死信、事务提交后确认），
        # 必须显式声明 manual——Spring 默认 AUTO 会在方法返回后自动确认，
        # 与手动 ACK 叠加触发 406 双重确认，channel 崩溃循环。此前该配置依赖
        # 本地 Nacos 下发，容器部署（Nacos 空跑）时必须由本地 yaml 兜底。
        acknowledge-mode: manual
  application:
    name: service-ai
  config:
    import: optional:nacos:service-ai.yaml   # ? Nacos ???
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml

server:
  port: 8085
codewise:
  internal-token: ${CODEWISE_INTERNAL_TOKEN}

# AI 端点：由 Nacos 下发 ai.models，每条配置按 type 选一个 AiProviderCreator 生成端点。
# 示例（真实值放 Nacos，勿提交密钥）：
# ai:
#   health-check.enabled: true        # false = 不起周期探测线程，改为调用时按失败计数发现故障
#   summary.provider: ollama          # 会话摘要固定用哪个端点（按名借用，不做故障切换）
#   models:
#     - name: GLM                     # 端点身份：日志/健康记账/key 池都用它，需唯一
#       type: openai                  # 缺省 openai（Authorization: Bearer <key>）
#       url: https://open.bigmodel.cn/api/paas/v4/chat/completions
#       modelName: [glm-4-flash, glm-4-air]
#       defaultModelName: glm-4-flash # 端点身份：健康记账、key 池、按名借用都用它
#       apiKeys: [sk-xxx]             # key 池，每次调用随机取一个
#       enabled: true
#       priority: 1                   # 越小越优先（AUTO 轮转）
#       timeout: 120000
#       headers: { x-tenant: cw }     # 可选，附加请求头原样下发
#     - name: opencode-go             # 订阅制上游（OpenCode Go），协议差异见 OpenCodeProtocol
#       type: opencode-go
#       url: https://opencode.ai/inference/go/v1/chat/completions
#       defaultModelName: deepseek-v4.1-flash
#       apiKeys: [oc_sk_xxx]
#       enabled: true
#       priority: 2
#       # 注意：该端点每次请求都必须带 x-opencode-session（由调用方传入的会话 id 派生），
#       # 所以只适合「指定模型」那条路；放进 AUTO 轮转会让没有会话概念的调用方（测试用例
#       # 生成、函数产物生成）拿到 400。
# 新增一种接入方式 = 新增一个 AiProviderCreator(+AiProtocol) Bean，本文件与工厂都不用改。

# 本服务不生产事件：显式关闭 OutboxPro（其自动配置默认 matchIfMissing=true）
outboxpro:
  enabled: false

api:
  governance:
    enabled: true
    log:
      enabled: true
      log-request-params: false
      log-response: false
      slow-threshold-ms: 2000
    rate-limit:
      type: redis
      algorithm: sliding-window
      default-limit: 60
      default-window: 60
      status-code: 429
      message: "AI 请求过于频繁，请稍后重试"
    management:
      enabled: true
      base-path: /api/ai/governance
