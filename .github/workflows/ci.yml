# CodeWise CI：push / PR 自动测试门禁
#
# 仓库无聚合 POM：先 install 两个共享模块，再矩阵并行跑 8 个服务的测试。
# 全上下文（contextLoads）测试依赖 Nacos/Redis/RabbitMQ，在 CI 中同样无法启动，
# 但它们只占每服务 1 个用例；其余纯 Mockito 单测构成回归门禁。
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  MAVEN_OPTS: -Dmaven.repo.local=.m2/repository

jobs:
  shared-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install parent POM & shared modules (api before common)
        run: |
          # Windows 提交易丢 mvnw 执行位（100644），此处兜底修正
          chmod +x mvnw
          ./mvnw -N -B install
          ./mvnw -f service-api/pom.xml -B -DskipTests install
          ./mvnw -f service-common/pom.xml -B -DskipTests install

  tests:
    needs: shared-modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - service-gateway
          - service-user
          - service-question
          - service-judge
          - service-review
          - service-community
          - service-message
          - service-ai
    name: test ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install parent POM & shared modules (per-job, isolated)
        run: |
          # Windows 提交易丢 mvnw 执行位（100644），此处兜底修正（后续步骤复用同一工作区）
          chmod +x mvnw
          ./mvnw -N -B install
          ./mvnw -f service-api/pom.xml -B -DskipTests install
          ./mvnw -f service-common/pom.xml -B -DskipTests install
      - name: Test ${{ matrix.module }}
        run: ./mvnw -f ${{ matrix.module }}/pom.xml -B test
