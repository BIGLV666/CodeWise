spring:
  rabbitmq:
    listener:
      simple:
        # 消费者代码使用手动 ACK/NACK（延迟重试、毒消息死信、事务提交后确认），
        # 必须显式声明 manual——Spring 默认 AUTO 会在方法返回后自动确认，
        # 与手动 ACK 叠加触发 406 双重确认，channel 崩溃循环。此前该配置依赖
        # 本地 Nacos 下发，容器部署（Nacos 空跑）时必须由本地 yaml 兜底。
        acknowledge-mode: manual
  application:
    name: service-question
  config:
    import: optional:nacos:service-question.yaml   # ? Nacos ???
  servlet:
    multipart:
      # 题目 HTML/Markdown 导入文件较大；与 nginx client_max_body_size 20m 对齐
      max-file-size: 20MB
      max-request-size: 20MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
server:
  port: 8084
codewise:
  internal-token: ${CODEWISE_INTERNAL_TOKEN}
  function-artifact:
    root: ./data/function-artifacts
    docker-command: docker
    docker-image: ${JUDGE_IMAGE:codewise-java-judge:17}
    timeout-seconds: 30

# OutboxPro（生产者）：事务内 append -> Relay 经 Publisher Confirm 投递；
# poll-interval 显式配纯毫秒：默认 "1000ms" 需要 Spring Framework 6.2 的 duration 解析，Boot 3.2.4 不支持
outboxpro:
  enabled: true
  producer:
    poll-interval: 1000

# 本服务 XML mapper 目录为大写 Mapper/（历史遗留）：MyBatis-Plus 默认只扫小写 mapper/，
# Windows 开发（大小写不敏感）能跑，Linux 容器（大小写敏感）加载不到导致
# Invalid bound statement，必须显式声明双路径
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml,classpath*:/Mapper/**/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

api:
  governance:
    enabled: true
    log:
      enabled: true
      log-request-params: false
      log-response: false
      slow-threshold-ms: 1000
    rate-limit:
      type: redis
      algorithm: sliding-window
      default-limit: -1
      default-window: 60
      status-code: 429
      message: "题目操作过于频繁，请稍后重试"
    management:
      enabled: true
      base-path: /api/question/governance
