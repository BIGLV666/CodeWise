spring:
  application:
    name: service-question
  config:
    import: optional:nacos:service-question.yaml   # ? Nacos ???
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yaml
server:
  port: 8084
codewise:
  internal-token: ${CODEWISE_INTERNAL_TOKEN}
  outbox:
    enabled: true
  function-artifact:
    root: ./data/function-artifacts
    judge-mode: local
    docker-command: docker
    docker-image: codewise-java-judge:17
    timeout-seconds: 30

api:
  governance:
    enabled: true
    log:
      enabled: true
      log-request-params: false
      log-response: false
      slow-threshold-ms: 1000
    rate-limit:
      type: redis
      algorithm: sliding-window
      default-limit: -1
      default-window: 60
      status-code: 429
      message: "题目操作过于频繁，请稍后重试"
    management:
      enabled: true
      base-path: /api/question/governance
