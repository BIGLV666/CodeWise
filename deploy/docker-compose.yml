# CodeWise 生产/演示环境一键编排
# 用法见 deploy/README.md。judge-go 原型不参与部署。
#
# 部署拓扑：
#   frontend(nginx:80) → gateway(8082) → 7 个业务服务
#   service-judge / service-question 挂载宿主 /var/run/docker.sock（DooD）执行判题沙箱
#   基础设施：mysql8 / redis7 / rabbitmq3 / nacos2.3（均持久化数据卷）
name: codewise

x-common-env: &common-env
  TZ: Asia/Shanghai
  NACOS_ADDR: nacos:8848
  CODEWISE_INTERNAL_TOKEN: ${CODEWISE_INTERNAL_TOKEN}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}

x-db-env: &db-env
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
  SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

x-app-base: &app-base
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    nacos:
      condition: service_healthy
  # 容器 stdout 日志轮转：防止磁盘被写满（各服务日志只落 stdout）
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

x-infra-logging: &infra-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

services:
  # ================= 判题基础镜像 =================
  # `up -d --build` 时自动构建 codewise-java-judge:17（判题沙箱依赖）。
  # 一次性空任务容器：立即退出（restart: "no"），不参与日常运行。
  judge-base:
    image: ${JUDGE_IMAGE:-codewise-java-judge:17}
    build:
      context: ./judge-base
    entrypoint: ["true"]
    restart: "no"
    <<: *infra-logging

  # ================= 基础设施 =================
  mysql:
    mem_limit: 1g
    image: mysql:8.4
    <<: *infra-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: codewise_user
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
      - ../service-user/src/main/resources/Sql:/sql/user:ro
      - ../service-question/src/main/resources/sql:/sql/question:ro
      - ../service-judge/src/main/resources/sql:/sql/judge:ro
      - ../service-review/src/main/resources/sql:/sql/review:ro
      - ../service-review/src/main/resources/migration:/sql/migration-review:ro
      - ../service-community/src/main/resources/sql.sql:/sql/community/sql.sql:ro
      - ../service-community/src/main/resources/migration:/sql/migration-community:ro
      - ../service-message/src/main/resources/sql.sql:/sql/message/sql.sql:ro
      - ../service-ai/src/main/resources/sql:/sql/ai:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    mem_limit: 192m
    image: redis:7-alpine
    <<: *infra-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  rabbitmq:
    mem_limit: 512m
    image: rabbitmq:3.13-management
    <<: *infra-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    # 管理台仅映射宿主回环，便于排障且不对公网暴露
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  nacos:
    mem_limit: 640m
    image: nacos/nacos-server:v2.3.2
    <<: *infra-logging
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    volumes:
      - nacos-data:/home/nacos/data
    # 控制台仅映射宿主回环：SMTP/AI Provider 等功能配置与排障入口（不对公网暴露）
    ports:
      - "127.0.0.1:8848:8848"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ================= 业务服务 =================
  service-gateway:
    mem_limit: 384m
    <<: *app-base
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args: { MODULE: service-gateway }
    image: ${CODEWISE_IMAGE_PREFIX:-codewise/}service-gateway:latest
    environment:
      <<: [*common-env]
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  service-user:
    mem_limit: 512m
    <<: *app-base
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args: { MODULE: service-user }
    image: ${CODEWISE_IMAGE_PREFIX:-codewise/}service-user:latest
    environment:
      <<: [*common-env, *db-env]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/codewise_user?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      JWT_SECRET: ${JWT_SECRET}
      FILE_UPLOAD_ROOT: /app/data/uploads
      ROOT_PASSWORD: ${ROOT_PASSWORD}
      ROOT_EMAIL: ${ROOT_EMAIL:-}
    volumes:
      - user-uploads:/app/data/uploads
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  service-question:
    mem_limit: 768m
    depends_on:
      judge-base:
        condition: service_completed_successfully
    <<: *app-base
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args: { MODULE: service-question, INSTALL_DOCKER_CLI: "true" }
    image: ${CODEWISE_IMAGE_PREFIX:-codewise/}service-question:latest
    # docker CLI 访问宿主 daemon，验收 AI 产物（沙箱容器）
    user: root
    environment:
      <<: [*common-env, *db-env]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/codewise_question?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      DOCKER_HOST: unix:///var/run/docker.sock
      JUDGE_IMAGE: ${JUDGE_IMAGE:-codewise-java-judge:17}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - question-artifacts:/app/data/function-artifacts
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  service-judge:
    mem_limit: 768m
    depends_on:
      judge-base:
        condition: service_completed_successfully
    <<: *app-base
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args: { MODULE: service-judge }
    image: ${CODEWISE_IMAGE_PREFIX:-codewise/}service-judge:latest
    # 判题需要创建/管理沙箱容器：挂载宿主 Docker daemon（DooD），故以 root 运行
    user: root
    environment:
      <<: [*common-env, *db-env]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/codewise_question?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8086/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  service-review:
    mem_limit: 512m
    <<: *app-base
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args: { MODULE: service-review }
    image: ${CODEWISE_IMAGE_PREFIX:-codewise/}service-review:latest
    environment:
      <<: [*common-env, *db-env]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/codewise_review?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8097:8097"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8097/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  service-community:
    mem_limit: 512m
    <<: *app-base
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args: { MODULE: service-community }
    image: ${CODEWISE_IMAGE_PREFIX:-codewise/}service-community:latest
    environment:
      <<: [*common-env, *db-env]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/codewise_community?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    ports:
      - "8087:8087"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8087/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  service-message:
    mem_limit: 512m
    <<: *app-base
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args: { MODULE: service-message }
    image: ${CODEWISE_IMAGE_PREFIX:-codewise/}service-message:latest
    environment:
      <<: [*common-env, *db-env]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/codewise_message?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  service-ai:
    mem_limit: 640m
    <<: *app-base
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args: { MODULE: service-ai }
    image: ${CODEWISE_IMAGE_PREFIX:-codewise/}service-ai:latest
    environment:
      <<: [*common-env, *db-env]
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/codewise_ai?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      # security.api-key-master-key 经 SPRING_APPLICATION_JSON 注入（属性名含中划线）
      SPRING_APPLICATION_JSON: '{"security":{"api-key-master-key":"${API_KEY_MASTER_KEY}"}}'
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ================= 前端 =================
  frontend:
    mem_limit: 64m
    image: ${CODEWISE_IMAGE_PREFIX:-codewise/}frontend:latest
    # 前端源码在兄弟仓库 CodeWise-frontend/CodeWise-frontend，用 dockerfile_inline 构建，
    # 与 deploy/frontend/Dockerfile 内容一致（后者作为独立构建参考）
    build:
      context: ../../CodeWise-frontend/CodeWise-frontend
      dockerfile_inline: |
        FROM node:22-alpine AS build
        WORKDIR /fe
        RUN corepack enable
        COPY package.json pnpm-lock.yaml pnpm-workspace.yaml ./
        ENV CI=true \
            npm_config_ignore_scripts=true
        RUN pnpm install --frozen-lockfile --ignore-scripts
        COPY . .
        RUN pnpm run build
        FROM nginx:1.27-alpine
        COPY --from=build /fe/dist /usr/share/nginx/html
        EXPOSE 80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - service-gateway
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
  question-artifacts:
  user-uploads:
