# CodeWise 前端站点（由 docker-compose 挂载到 codewise/frontend 容器）
# 端口 80：静态资源 + /api 反代网关 + /uploads 反代用户服务 + /websocket WebSocket 升级

# 上游必须是「请求时解析」而不是「启动时解析一次」。
#
# nginx 在配置加载时就把 proxy_pass / upstream 里的主机名解析成 IP 并一直缓存：容器重建后
# 换了 IP，nginx 仍发往旧地址，表现为全站 /api 502（前端 request.ts 把它提示成「服务正在
# 升级或维护，请稍后重试」），而宿主机直连网关却完全正常——排查时极易误判成后端故障。
# 2026-10-13 重建 service-gateway 后即踩到：nginx 还在发 172.18.0.15，网关实际已是 172.18.0.9。
#
# 解法：配 Docker 内嵌 DNS（127.0.0.11）并把上游写成变量。proxy_pass 里出现变量时 nginx
# 会按 resolver 的 valid 周期重新解析，容器换 IP 后最多 10s 自愈，无需重启前端。
server {
    listen 80;
    server_name _;

    # 生产部署请改为你的域名并配置 301 跳转 https
    # server_name codewise.example.com;
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream "service-gateway:8082";
    set $agent_upstream   "codewise-agent:8000";

    # 允许上传的请求体上限（需大于各服务 multipart 限制，默认 1m 会 413 掉大头像/题目导入）
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 前端路由 history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 统一走网关
    location /api/ {
        # 变量形式且不带 URI：按原始请求 URI 透传（与原 upstream 写法语义一致）
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/ai/advice/ask 是 POST SSE：禁用缓冲，放大读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # 用户头像、题目配图等上传文件。
    # 必须经网关转发，不能直连 service-user：service-user 的 UserAuthInterceptor 要求
    # X-Internal-Token，该头只由网关注入（且网关已有 /uploads/** 路由与公开白名单）；
    # 直连会得到 403「禁止直接访问，请通过网关访问」，头像全部加载失败。
    location /uploads/ {
        proxy_pass http://$gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 图片内容基本不变，交给浏览器缓存，减少网关压力
        proxy_cache off;
    }

    # Python Agent（codewise-agent）：/agentapi/ 前缀剥离后反代到 8000。
    # 含 SSE 流式对话，禁缓冲、放大读超时。
    # 注意：proxy_pass 带变量时不能再写 URI（写了会把请求 URI 整个替换掉、前缀剥离失效），
    # 故先用 rewrite break 剥前缀，再由不带 URI 的 proxy_pass 透传。
    location /agentapi/ {
        rewrite ^/agentapi/(.*)$ /$1 break;
        proxy_pass http://$agent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # WebSocket：必须透传 Upgrade/Connection 头
    location /websocket {
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
