# CodeWise 前端站点（由 docker-compose 挂载到 codewise/frontend 容器）
# 端口 80：静态资源 + /api 反代网关 + /uploads 反代用户服务 + /websocket WebSocket 升级

upstream codewise_gateway {
    server service-gateway:8082;
}

upstream codewise_user {
    server service-user:8081;
}

server {
    listen 80;
    server_name _;

    # 生产部署请改为你的域名并配置 301 跳转 https
    # server_name codewise.example.com;
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    # 允许上传的请求体上限（需大于各服务 multipart 限制，默认 1m 会 413 掉大头像/题目导入）
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 前端路由 history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 统一走网关
    location /api/ {
        proxy_pass http://codewise_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/ai/advice/ask 是 POST SSE：禁用缓冲，放大读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # 用户头像等静态上传文件（service-user 托管）
    location /uploads/ {
        proxy_pass http://codewise_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Python Agent（codewise-agent）：/agentapi/ 前缀剥离后反代到 8000。
    # 含 SSE 流式对话，禁缓冲、放大读超时
    location /agentapi/ {
        proxy_pass http://codewise-agent:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # WebSocket：必须透传 Upgrade/Connection 头
    location /websocket {        proxy_pass http://codewise_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
