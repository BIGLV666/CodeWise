<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeWise 冻结通知</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f5f7fa;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f5f7fa; padding: 40px 20px;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
                    <tr>
                        <td style="background: linear-gradient(135deg, #0F131C 0%, #161D2B 100%); padding: 32px 40px; text-align: center;">
                            <h1 style="margin: 0; color: #38BDF8; font-size: 28px; font-weight: 700; letter-spacing: -0.5px;">CodeWise</h1>
                            <p style="margin: 8px 0 0 0; color: #94A3B8; font-size: 14px;">在线编程学习平台</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 32px 40px 24px 40px;">
                            <h2 style="margin: 0; color: #0F131C; font-size: 22px; font-weight: 600;">❄️ 账号冻结通知</h2>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 0 40px 24px 40px;">
                            <p style="margin: 0; color: #334155; font-size: 15px; line-height: 1.6;">
                                亲爱的 <strong style="color: #0F131C;">{{username}}</strong>，您好！
                            </p>
                            <p style="margin: 12px 0 0 0; color: #334155; font-size: 15px; line-height: 1.6;">
                                您的账号已按您的请求被冻结，冻结期间将无法登录使用。
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 0 40px 24px 40px;">
                            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #FFFBEB; border-radius: 8px; border-left: 4px solid #F59E0B;">
                                <tr>
                                    <td style="padding: 20px 24px;">
                                        <p style="margin: 0 0 12px 0; color: #92400E; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">冻结详情</p>
                                        <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td style="padding: 8px 0; color: #92400E; font-size: 14px; width: 100px;">冻结原因：</td>
                                                <td style="padding: 8px 0; color: #78350F; font-size: 14px; font-weight: 500;">{{banReason}}</td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 0 40px 24px 40px;">
                            <p style="margin: 0; color: #475569; font-size: 13px; line-height: 1.6;">
                                如需重新启用账号，请联系管理员或客服团队协助解冻。
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 0 40px;">
                            <div style="height: 1px; background-color: #E2E8F0;"></div>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 24px 40px 32px 40px; text-align: center;">
                            <p style="margin: 0 0 8px 0; color: #334155; font-size: 14px; font-weight: 500;">需要帮助？</p>
                            <p style="margin: 0; color: #64748B; font-size: 13px;">
                                邮箱：<a href="mailto:support@codewise.com" style="color: #38BDF8; text-decoration: none;">support@codewise.com</a>
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="background-color: #F8FAFC; padding: 24px 40px; text-align: center; border-top: 1px solid #E2E8F0;">
                            <p style="margin: 0 0 8px 0; color: #64748B; font-size: 12px;">这是一封自动发送的邮件，请勿直接回复</p>
                            <p style="margin: 0; color: #94A3B8; font-size: 12px;">© 2026 CodeWise. 保留所有权利</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
