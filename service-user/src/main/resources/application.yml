spring:
  rabbitmq:
    listener:
      simple:
        # 消费者代码使用手动 ACK/NACK（延迟重试、毒消息死信、事务提交后确认），
        # 必须显式声明 manual——Spring 默认 AUTO 会在方法返回后自动确认，
        # 与手动 ACK 叠加触发 406 双重确认，channel 崩溃循环。此前该配置依赖
        # 本地 Nacos 下发，容器部署（Nacos 空跑）时必须由本地 yaml 兜底。
        acknowledge-mode: manual
  application:
    name: service-user
  config:
    import: optional:nacos:service-user.yaml   # Nacos 不可用时环境变量兜底
  servlet:
    multipart:
      # 业务代码 FileUploadService 上限 5MB，此处留余量；nginx 侧 client_max_body_size 20m
      max-file-size: 6MB
      max-request-size: 10MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        # 容器部署时经环境变量 SPRING_CLOUD_NACOS_DISCOVERY_IP 指定注册 IP；本地开发自动选网卡
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml

codewise:
  mq:
    enabled: true
  internal-token: ${CODEWISE_INTERNAL_TOKEN}
  bootstrap:
    root:
      # Docker 一次性初始化 root 管理员（全局唯一）。
      enabled: true
      username: ${ROOT_USERNAME:admin}
      password: ${ROOT_PASSWORD:}
      nickname: ${ROOT_NICKNAME:}
      email: ${ROOT_EMAIL:}
      phone: ${ROOT_PHONE:}

server:
  port: 8081   # ??????????????????

# 本服务不生产事件：显式关闭 OutboxPro（其自动配置默认 matchIfMissing=true）
outboxpro:
  enabled: false

# JWT 签发密钥（登录 token 由本服务签发）；容器部署经 JWT_SECRET 注入，
# 与网关校验、message/review 同值
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}

api:
  governance:
    enabled: true
    log:
      enabled: true
      log-request-params: false
      log-response: false
      slow-threshold-ms: 500
    rate-limit:
      type: redis
      algorithm: sliding-window
      default-limit: -1
      default-window: 60
      status-code: 429
      message: "请求过于频繁，请稍后重试"
    metrics:
      window-size: 100
      window-seconds: 300
      max-apis: 1000
    management:
      enabled: true
      base-path: /api/user/governance

