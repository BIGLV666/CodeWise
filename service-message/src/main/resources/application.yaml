spring:
  rabbitmq:
    listener:
      simple:
        # 消费者代码使用手动 ACK/NACK（延迟重试、毒消息死信、事务提交后确认），
        # 必须显式声明 manual——Spring 默认 AUTO 会在方法返回后自动确认，
        # 与手动 ACK 叠加触发 406 双重确认，channel 崩溃循环。此前该配置依赖
        # 本地 Nacos 下发，容器部署（Nacos 空跑）时必须由本地 yaml 兜底。
        acknowledge-mode: manual
  application:
    name: service-message
  config:
    import:
      - optional:nacos:service-email.yaml
      - optional:nacos:service-message.yaml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
        group: DEFAULT_GROUP
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        group: DEFAULT_GROUP

codewise:
  mq:
    enabled: true
  internal-token: ${CODEWISE_INTERNAL_TOKEN}

# JWT 校验密钥经环境变量注入；本地 application.yaml 优先于 Nacos import，以环境变量为准
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

server:
  port: 8083

# 本服务不生产事件：显式关闭 OutboxPro（其自动配置默认 matchIfMissing=true）
outboxpro:
  enabled: false

api:
  governance:
    enabled: true
    log:
      enabled: true
      log-request-params: false
      log-response: false
      slow-threshold-ms: 500
    rate-limit:
      type: redis
      algorithm: sliding-window
      default-limit: -1
      default-window: 60
      status-code: 429
      message: "通知操作过于频繁，请稍后重试"
    management:
      enabled: true
      base-path: /api/message/governance
