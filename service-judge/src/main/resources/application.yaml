spring:
  application:
    name: service-judge
  config:
    import: optional:nacos:service-judge.yaml   # ? Nacos ???
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yaml
server:
  port: 8086

# judge 与 question 共库 event_outbox，两侧 Relay 用 SKIP LOCKED 并发安全
codewise:
  outbox:
    enabled: true
  internal-token: ${CODEWISE_INTERNAL_TOKEN}

api:
  governance:
    enabled: true
    log:
      enabled: true
      log-request-params: false
      log-response: false
      slow-threshold-ms: 1000
    rate-limit:
      type: redis
      algorithm: sliding-window
      default-limit: -1
      default-window: 60
      status-code: 429
      message: "判题容器操作过于频繁，请稍后重试"
    management:
      enabled: true
      base-path: /api/judge/governance
