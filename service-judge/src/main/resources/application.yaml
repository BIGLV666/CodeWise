spring:
  rabbitmq:
    listener:
      simple:
        # 消费者代码使用手动 ACK/NACK（延迟重试、毒消息死信、事务提交后确认），
        # 必须显式声明 manual——Spring 默认 AUTO 会在方法返回后自动确认，
        # 与手动 ACK 叠加触发 406 双重确认，channel 崩溃循环。此前该配置依赖
        # 本地 Nacos 下发，容器部署（Nacos 空跑）时必须由本地 yaml 兜底。
        acknowledge-mode: manual
  application:
    name: service-judge
  config:
    import: optional:nacos:service-judge.yaml   # ? Nacos ???
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
server:
  port: 8086

codewise:
  internal-token: ${CODEWISE_INTERNAL_TOKEN}

# OutboxPro（生产者）：与 question 共用 codewise_question 库的 outboxpro_* 表，
# 双 Relay 由 FOR UPDATE SKIP LOCKED 保证并发安全。
# poll-interval 显式配纯毫秒：默认 "1000ms" 需要 Spring Framework 6.2 的 duration 解析，Boot 3.2.4 不支持
outboxpro:
  enabled: true
  producer:
    poll-interval: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

