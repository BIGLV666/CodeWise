spring:
  application:
    name: service-gateway
  config:
    import: optional:nacos:service-gateway.yaml   # Nacos 配置中心（可选：缺失时由本地 yaml + 环境变量兜底）
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # 允许的来源经 CORS_ORIGINS 注入（逗号分隔），默认本地开发前端
            allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      routes:
        # 1. WebSocket 路由
        - id: service-message
          uri: lb:ws://service-message
          predicates:
            - Path=/websocket/**

        # 通知中心 HTTP 接口
        - id: service-message-http
          uri: lb://service-message
          predicates:
            - Path=/api/message/**

        # 2. 用户服务
        - id: service-user
          uri: lb://service-user
          predicates:
            - Path=/api/user/**

        # 3. 题目服务
        - id: service-question
          uri: lb://service-question
          predicates:
            - Path=/api/question/**

        # 判题容器管理
        - id: service-judge
          uri: lb://service-judge
          predicates:
            - Path=/api/judge/**

        # 4. AI 服务
        - id: service-ai
          uri: lb://service-ai
          predicates:
            - Path=/api/ai/**
        # 5.复习收藏服务
        - id: service-review
          uri: lb://service-review
          predicates:
            - Path=/api/review/**
        # 6，静态资源
        - id: service-user-uploads
          uri: lb://service-user
          predicates:
            - Path=/uploads/**
        #7-社区
        - id: service-community
          uri: lb://service-community
          predicates:
            - Path=/api/community/**



jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

codewise:
  internal-token: ${CODEWISE_INTERNAL_TOKEN}

# 网关无数据源且不生产事件：显式关闭 OutboxPro（其自动配置默认 matchIfMissing=true）
outboxpro:
  enabled: false

server:
  port: 8082

logging:
  level:
    # 生产默认 INFO；排障时可临时调 DEBUG（原样例为 DEBUG，会放大日志量并可能记录请求信息）
    org.springframework.cloud.gateway: INFO
    org.springframework.web: INFO



