spring:
  application:
    name: service-community
  config:
    import: optional:nacos:service-community.yaml   # ? Nacos ???
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml

codewise:
  mq:
    enabled: true
  internal-token: ${CODEWISE_INTERNAL_TOKEN}
  async:
    cascade-delete:
      core-pool-size: 2
      max-pool-size: 8
      queue-capacity: 100
      keep-alive-seconds: 60
      await-termination-seconds: 30
    bucket-consumer:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 100
      await-termination-seconds: 30

# OutboxPro（生产者）：申诉通知与业务同事务登记，Relay 经 Publisher Confirm 投递；
# poll-interval 显式配纯毫秒：默认 "1000ms" 需要 Spring Framework 6.2 的 duration 解析，Boot 3.2.4 不支持
outboxpro:
  enabled: true
  producer:
    poll-interval: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: 8087

api:
  governance:
    enabled: true
    log:
      enabled: true
      log-request-params: false
      log-response: false
      slow-threshold-ms: 800
    rate-limit:
      type: redis
      algorithm: sliding-window
      default-limit: -1
      default-window: 60
      status-code: 429
      message: "社区操作过于频繁，请稍后重试"
    metrics:
      window-size: 100
      window-seconds: 300
      max-apis: 1000
    management:
      enabled: true
      base-path: /api/community/governance
