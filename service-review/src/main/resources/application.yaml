spring:
  application:
    name: service-review
  config:
    import: optional:nacos:service-review.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        # 容器部署时经环境变量 SPRING_CLOUD_NACOS_DISCOVERY_IP 指定注册 IP；本地开发自动选网卡
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml

server:
  port: 8097

codewise:
  internal-token: ${CODEWISE_INTERNAL_TOKEN}
  outbox:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

api:
  governance:
    enabled: true
    log:
      enabled: true
      log-request-params: false
      log-response: false
      slow-threshold-ms: 800
    rate-limit:
      type: redis
      algorithm: sliding-window
      default-limit: -1
      default-window: 60
      status-code: 429
      message: "复习操作过于频繁，请稍后重试"
    management:
      enabled: true
      base-path: /api/review/governance
