spring:
  rabbitmq:
    listener:
      simple:
        # 消费者代码使用手动 ACK/NACK（延迟重试、毒消息死信、事务提交后确认），
        # 必须显式声明 manual——Spring 默认 AUTO 会在方法返回后自动确认，
        # 与手动 ACK 叠加触发 406 双重确认，channel 崩溃循环。此前该配置依赖
        # 本地 Nacos 下发，容器部署（Nacos 空跑）时必须由本地 yaml 兜底。
        acknowledge-mode: manual
  application:
    name: service-review
  config:
    import: optional:nacos:service-review.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        # 容器部署时经环境变量 SPRING_CLOUD_NACOS_DISCOVERY_IP 指定注册 IP；本地开发自动选网卡
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml

server:
  port: 8097

codewise:
  internal-token: ${CODEWISE_INTERNAL_TOKEN}

# OutboxPro（生产者）：事务内 append -> Relay 经 Publisher Confirm 投递；
# poll-interval 显式配纯毫秒：默认 "1000ms" 需要 Spring Framework 6.2 的 duration 解析，Boot 3.2.4 不支持
outboxpro:
  enabled: true
  producer:
    poll-interval: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

api:
  governance:
    enabled: true
    log:
      enabled: true
      log-request-params: false
      log-response: false
      slow-threshold-ms: 800
    rate-limit:
      type: redis
      algorithm: sliding-window
      default-limit: -1
      default-window: 60
      status-code: 429
      message: "复习操作过于频繁，请稍后重试"
    management:
      enabled: true
      base-path: /api/review/governance
